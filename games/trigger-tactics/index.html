function canAction(u,a){if(!legalUnit(u))return false;const c=CLS[u.cls],sk=c.sk;if(a==='move')return!u.moved;if(a==='undo')return!!u.origin&&!unitAt(u.origin.x,u.origin.y);if(a==='attack')return u.t>c.ac&&atkTargets(u).length>0;if(a==='skill'){if(u.t<=sk.cost)return false;if(sk.type==='hide')return!u.hidden;if(sk.type==='all'||sk.type==='line')return true;if(['pierce','double'].includes(sk.type))return targets(u,sk.r).length>0;return true;}if(a==='shield'||a==='claim')return u.t>1;if(a==='recover')return u.t<c.max&&S.owner[u.y][u.x]!==opp(u.team);return a==='wait';}
function execute(u,a){if(!legalUnit(u))return false;const c=CLS[u.cls],sk=c.sk;if(!canAction(u,a.type))return false;let msg='';if(a.type==='attack'){if(!validTarget(u,a.tg,c.rng,c.min||1))return false;u.t-=c.ac;u.hidden=false;msg=`${tag(u)}の攻撃：${hit(u,a.tg,c.atk)}`;}
else if(a.type==='skill'){if(sk.type==='line'){if(!DIRS.some(d=>d[0]===a.dir?.[0]&&d[1]===a.dir?.[1]))return false;msg=areaHits(u,lineTiles(u,a.dir)).map(t=>hit(u,t,sk.dmg)).join('、')||'空振り';u.hidden=false;}else if(sk.type==='all'){msg=areaHits(u,radiusTiles(u.x,u.y,sk.r)).map(t=>hit(u,t,sk.dmg)).join('、')||'空振り';u.hidden=false;}else if(['pierce','double'].includes(sk.type)){if(!validTarget(u,a.tg,sk.r))return false;msg=hit(u,a.tg,sk.dmg,sk.type==='pierce');if(sk.type==='double'&&(a.tg.kind==='base'||a.tg.u.alive))msg+='、'+hit(u,a.tg,sk.dmg);u.hidden=false;}else if(sk.type==='hide'){u.hidden=true;msg='隠密状態に移行';}else if(sk.type==='aura'){let n=0;for(const f of S.units)if(f.alive&&f.team===u.team&&dist(u.x,u.y,f.x,f.y)<=sk.r){f.shield+=sk.v;n++;}msg=`味方${n}人のシールド+${sk.v}`;}u.t-=sk.cost;msg=`${tag(u)}「${sk.name}」：${msg}`;}
else if(a.type==='shield'){u.t--;u.shield+=3;msg=`${tag(u)}がシールド+3を展開`;}
else if(a.type==='claim'){u.t--;let n=0;for(const t of claimTiles(u)){if(S.owner[t.y][t.x]!==u.team)n++;setOwner(t.x,t.y,u.team);}msg=`${tag(u)}が${n}マスを新たに占拠`;}
else if(a.type==='recover'){const n=Math.min(c.max-u.t,S.owner[u.y][u.x]===u.team?2:1);u.t+=n;msg=`${tag(u)}がトリオンを${n}回復`;}
else if(a.type==='wait'){msg=`${tag(u)}が待機`;}
else return false;
u.acted=true;u.moved=true;u.origin=null;log(msg);if(S.ui){S.ui.sel=null;S.ui.mode=null;}return true;}
function moveUnit(u,x,y){if(!canAction(u,'move')||!reach(u).some(p=>p.x===x&&p.y===y)||(x===u.x&&y===u.y))return false;u.origin={x:u.x,y:u.y};u.x=x;u.y=y;u.moved=true;return true;}
function startTurn(team){for(const u of S.units)if(u.alive&&u.team===team){u.shield=0;u.moved=false;u.acted=false;u.origin=null;const o=S.owner[u.y][u.x],mx=CLS[u.cls].max;if(o===team)u.t=Math.min(mx,u.t+(getRelay(u.x,u.y)?2:1));else if(o===opp(team)){u.t=Math.max(0,u.t-1);if(u.t===0){u.alive=false;S.bails[opp(team)]++;log(`${tag(u)}がトリオン切れで緊急脱出`);}}}}
function endClaim(team){for(const u of S.units)if(u.alive&&u.team===team)setOwner(u.x,u.y,team)}
function relayIncome(){for(const r of S.relays)if(r.owner)S.signal[r.owner]++;const p=S.relays.filter(r=>r.owner==='P').length,e=S.relays.filter(r=>r.owner==='E').length;if(p||e)log(`中継点ボーナス：味方+${p}／敵+${e}点`);}
function finishGame(result,reason){if(S.phase==='over')return;S.phase='over';S.result={result,reason};S.ui={sel:null,mode:null,view:null};records.played++;if(result==='win')records.won++;save();modal='result';render();}
function checkEnd(){if(!S||S.phase==='over')return true;if(S.base.E.hp<=0){finishGame('win','敵基地の破壊に成功');return true}if(S.base.P.hp<=0){finishGame('loss','味方基地が破壊された');return true}if(!S.units.some(u=>u.alive&&u.team==='E')){finishGame('win','敵部隊が全員緊急脱出');return true}if(!S.units.some(u=>u.alive&&u.team==='P')){finishGame('loss','味方部隊が全員緊急脱出');return true}return false;}
function endByScore(){const p=score('P'),e=score('E');finishGame(p>e?'win':p<e?'loss':'draw',`${S.maxRounds}ラウンド終了・総合得点で判定`)}
function aiPick(){const ps=Object.values(PRESETS);return{...ps[Math.floor(Math.random()*ps.length)].pick}}
function startGame(enemy=null){if(pickCost(pick)>BUDGET||pickCount(pick)>MAXU||pickCount(pick)<1)return;session++;modal=null;const map=MAPS[config.map],terr=Array.from({length:H},()=>Array(W).fill(0)),owner=Array.from({length:H},()=>Array(W).fill(null));map.walls.forEach(([x,y])=>terr[y][x]=1);for(let x=0;x<W;x++)for(const y of[0,1,11,12])owner[y][x]=y<2?'E':'P';terr[0][4]=terr[12][4]=2;const base={P:{x:4,y:12,hp:20},E:{x:4,y:0,hp:20}},units=[],slots=[4,3,5,2,6];let id=0;const enemyPick=enemy||aiPick();const add=(p,team,row)=>{let i=0;for(const k in CLS)for(let j=0;j<(p[k]||0);j++){const c=CLS[k];units.push({id:id++,team,cls:k,x:slots[i++],y:row,t:c.max,shield:0,hidden:false,moved:false,acted:false,alive:true,origin:null})}};add(pick,'P',11);add(enemyPick,'E',1);S={session,terr,owner,base,units,enemyPick,round:1,maxRounds:config.rounds,map:config.map,difficulty:config.difficulty,relays:map.relays.map(([x,y],i)=>({x,y,label:String.fromCharCode(65+i),owner:null})),bails:{P:0,E:0},signal:{P:0,E:0},phase:'play',ui:{sel:null,mode:null,view:null},log:['作戦開始。味方を選び、青いマスへ移動しよう。']};save();boardFocus={x:4,y:11};render();window.scrollTo({top:0,behavior:'instant'});}
function quitGame(){session++;S=null;modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function valueHit(tg,d,pierce=false){if(tg.kind==='base')return d>=S.base[tg.team].hp?90:d*1.35;const e=tg.u,eff=pierce?d:Math.max(0,d-e.shield);return Math.min(e.t,eff)+(eff>=e.t?9:0)}
function aiOptions(u,px,py){const c=CLS[u.cls],sk=c.sk,opts=[];if(u.t>c.ac)for(const tg of atkTargets(u,px,py))opts.push({v:valueHit(tg,c.atk)-c.ac*.25,a:{type:'attack',tg}});if(u.t>sk.cost){if(sk.type==='line')for(const dir of DIRS){const hits=areaHits(u,lineTiles(u,dir,px,py),true);if(hits.length)opts.push({v:hits.reduce((s,h)=>s+valueHit(h,sk.dmg),0)-sk.cost*.3,a:{type:'skill',dir}})}if(sk.type==='all'){const hits=areaHits(u,radiusTiles(px,py,sk.r),true);if(hits.length)opts.push({v:hits.reduce((s,h)=>s+valueHit(h,sk.dmg),0)-sk.cost*.3,a:{type:'skill'}})}if(['pierce','double'].includes(sk.type))for(const tg of targets(u,sk.r,1,px,py))opts.push({v:valueHit(tg,sk.dmg*(sk.type==='double'?2:1),sk.type==='pierce')-sk.cost*.3,a:{type:'skill',tg}})}return opts.sort((a,b)=>b.v-a.v)}
function threatAt(u,x,y){let danger=0;for(const e of S.units)if(e.alive&&e.team!==u.team&&!e.hidden){const c=CLS[e.cls],d=dist(x,y,e.x,e.y);if(d>= (c.min||1)&&d<=c.rng)danger+=c.atk;if(d>c.rng&&d<=c.rng+c.mv)danger+=c.atk*.3}return danger;}
function aiFallback(u){const sk=CLS[u.cls].sk,threat=threatAt(u,u.x,u.y);if(canAction(u,'recover')&&(u.t<=CLS[u.cls].max*.5||u.t<=3))return{type:'recover'};if(canAction(u,'claim')&&claimTiles(u).some(({x,y})=>getRelay(x,y)&&S.owner[y][x]!=='E'))return{type:'claim'};if(sk.type==='aura'&&canAction(u,'skill')&&S.units.filter(f=>f.alive&&f.team==='E'&&dist(u.x,u.y,f.x,f.y)<=sk.r&&threatAt(f,f.x,f.y)>0).length>=2)return{type:'skill'};if(canAction(u,'claim')&&claimTiles(u).filter(({x,y})=>S.owner[y][x]!=='E').length>=2&&u.t>3)return{type:'claim'};if(sk.type==='hide'&&canAction(u,'skill')&&threat>1)return{type:'skill'};if(canAction(u,'recover'))return{type:'recover'};if(canAction(u,'shield')&&threat>1)return{type:'shield'};return{type:'wait'};}
function aiUnit(u){if(!legalUnit(u))return;const difficulty=S.difficulty,hard=difficulty==='tactical',easy=difficulty==='training',eb=S.base.E,pb=S.base.P;let best=null;const objectives=S.relays.filter(r=>r.owner!=='E');for(const p of reach(u)){const own=S.owner[p.y][p.x],danger=threatAt(u,p.x,p.y),os=aiOptions(u,p.x,p.y),top=os[0];const goalDist=objectives.length?Math.min(...objectives.map(r=>dist(p.x,p.y,r.x,r.y))):dist(p.x,p.y,pb.x,pb.y);let v=(top?top.v*(easy?5:8):0)-goalDist*(easy?.9:2.1);const relay=getRelay(p.x,p.y);if(relay&&relay.owner!=='E')v+=hard?11:8;else if(relay&&relay.owner==='E')v+=2;if(own!=='E')v+=1;v+=claimTiles(u,p.x,p.y).filter(t=>S.owner[t.y][t.x]!=='E').length*.3;if(u.t<=4){v+=(own==='E'?15:own===null?2:-6)-danger*2.1;v-=dist(p.x,p.y,eb.x,eb.y)*.2;}else if(hard)v-=danger*(danger>=u.t?2.8:.4);else if(!easy)v-=danger*.15;const attackers=S.units.filter(e=>e.alive&&e.team==='P'&&!e.hidden&&dist(e.x,e.y,eb.x,eb.y)<=4);if(attackers.length&&hard)v-=Math.min(...attackers.map(e=>dist(p.x,p.y,e.x,e.y)))*1.3;v-=Math.abs(p.x-u.x)*.01+Math.abs(p.y-u.y)*.01;if(!best||v>best.v)best={p,v,action:top?.a};}if(!best)return;if(best.p.x!==u.x||best.p.y!==u.y)moveUnit(u,best.p.x,best.p.y);let a=best.action;if(u.t<=3&&canAction(u,'recover')&&(!a||aiOptions(u,u.x,u.y)[0]?.v<10))a={type:'recover'};if(!a)a=aiFallback(u);if(!execute(u,a))execute(u,aiFallback(u));}
async function endTurn(){if(!S||S.phase!=='play'||modal)return;const game=S,token=session;S.phase='ai';S.ui={sel:null,mode:null,view:null};endClaim('P');if(checkEnd())return;startTurn('E');if(checkEnd())return;log('敵部隊が行動中…');render();await sleep(320/config.speed);if(S!==game||session!==token||S.phase!=='ai')return;for(const u of game.units.filter(u=>u.team==='E')){if(S!==game||session!==token||S.phase!=='ai')return;if(!u.alive)continue;aiUnit(u);if(checkEnd())return;render();await sleep(350/config.speed);}if(S!==game||session!==token||S.phase!=='ai')return;endClaim('E');relayIncome();if(checkEnd())return;if(S.round>=S.maxRounds)return endByScore();S.round++;S.phase='play';startTurn('P');log(`ラウンド${S.round}：あなたのターン`);if(!checkEnd())render();}
const selU=()=>S?.units.find(u=>u.id===S.ui.sel&&u.alive);
function selectUnit(id){if(!S||S.phase!=='play'||modal)return;const u=S.units.find(u=>u.id===id&&u.alive&&u.team==='P');if(!u)return;S.ui.sel=id;S.ui.view=null;S.ui.mode=canAction(u,'move')?'move':null;boardFocus={x:u.x,y:u.y};render();}
function finishPlayerAction(u,a){if(S?.phase!=='play'||u.team!=='P'||modal)return;if(execute(u,a)&&!checkEnd())render();}
function onTile(x,y){if(!S||S.phase!=='play'||modal)return;boardFocus={x,y};const u=selU(),m=S.ui.mode;if(u&&legalUnit(u)){if(m==='move'&&moveUnit(u,x,y)){S.ui.mode=null;render();return}if(m==='attack'){const tg=atkTargets(u).find(t=>t.x===x&&t.y===y);if(tg){finishPlayerAction(u,{type:'attack',tg});return}}if(m==='skill'){const sk=CLS[u.cls].sk;if(sk.type==='line'){const dir=DIRS.find(d=>lineTiles(u,d).some(t=>t.x===x&&t.y===y));if(dir){finishPlayerAction(u,{type:'skill',dir});return}}else{const tg=targets(u,sk.r).find(t=>t.x===x&&t.y===y);if(tg){finishPlayerAction(u,{type:'skill',tg});return}}}}
const o=unitAt(x,y);if(o&&o.team==='P')selectUnit(o.id);else if(o&&!o.hidden){S.ui={sel:null,mode:null,view:o.id};render()}else if(!m){S.ui={sel:null,mode:null,view:null};render()}else toast('ハイライトされたマスを選んでください');}
function onAct(a){const u=selU();if(!u||S.phase!=='play'||modal||!canAction(u,a))return;const sk=CLS[u.cls].sk;if(a==='undo'){u.x=u.origin.x;u.y=u.origin.y;u.origin=null;u.moved=false;S.ui.mode='move';render();return}if(['move','attack'].includes(a)||(a==='skill'&&['line','pierce','double'].includes(sk.type))){S.ui.mode=S.ui.mode===a?null:a;render();return}finishPlayerAction(u,{type:a});}
function highlights(){const u=selU(),m=S.ui.mode,h={mv:[],tg:[],sk:[]};if(!u||S.phase!=='play'||!legalUnit(u))return h;if(m==='move'&&!u.moved)h.mv=reach(u).filter(t=>t.x!==u.x||t.y!==u.y);else if(m==='attack')h.tg=atkTargets(u);else if(m==='skill'){const sk=CLS[u.cls].sk;if(sk.type==='line')h.sk=DIRS.flatMap(d=>lineTiles(u,d));else h.tg=targets(u,sk.r);}return h;}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2300)}
const header=()=>`<header class="topbar"><div class="brand"><span class="brand-mark">${icon('bolt')}</span><div>陣取りトリガー戦<small>TERRITORY TRIGGER / TACTICAL OPERATIONS</small></div></div><div class="top-actions">${S?`<button class="btn quiet" data-cmd="speed" aria-label="CPUの速度を切り替える">${config.speed===2?'倍速 ×2':'速度 ×1'}</button>`:`<button class="btn primary quickstart" data-cmd="start" ${pickCount(pick)?'':'disabled'}>すぐ出撃</button>`}<button class="btn quiet" data-cmd="help">遊び方</button>${S?'<button class="btn quiet" data-cmd="quit">編成へ</button>':''}</div></header>`;
function rules(){return`<div class="eyebrow">FIELD MANUAL</div><h2>戦場の読み方</h2><p>隊員を選ぶ → 青いマスへ移動 → 行動を1つ選ぶ。全員を動かしたら「ターン終了」。先に行動すると、その隊員は移動できません。</p><div class="rule-section"><h3>3つの勝ち筋</h3><ul><li>耐久20の敵基地を破壊する</li><li>敵部隊を全員、緊急脱出させる</li><li>最終ラウンドで「陣地数＋撃破×3＋中継点ボーナス」の合計を上回る。同点は引き分け</li></ul></div><div class="rule-section"><h3>陣地と中継点 ◆</h3><ul><li>各ターン終了時、立っているマスを自陣化。「占拠」は周囲1マスもまとめて制圧（トリオン1）</li><li>中継点も移動・占拠で制圧。誰もいなくても制圧を維持し、双方のターンが終わるたびに1拠点につき+1点</li><li>自陣で始まるターンはトリオン+1、自陣の中継点上なら+2</li><li>移動は縦横。敵陣は移動コスト2。建物・基地・他の隊員のマスに止まれません。味方は通り抜け可能</li></ul></div><div class="rule-section"><h3>トリオン＝体力＋燃料</h3><ul><li>攻撃・技・占拠・シールドで消費。行動後に1以上残す必要があります。ダメージで0になると緊急脱出</li><li>シールドは次の自ターンまでの吸収量+3。回復は自陣で+2、中立で+1、敵陣では不可。どちらも行動1回を使います</li><li>攻撃の距離は縦＋横。通常射撃は建物越しにも届きます。「延伸斬り」だけは建物で止まります</li><li>隠密中は単体攻撃で狙えません。範囲攻撃に当たるか、自分が攻撃すると解除。範囲攻撃は自分の味方に当たりません</li><li>移動の取り消しは、行動前だけ可能。CPUも同じコスト・回復・視界ルールです</li></ul></div><div class="rule-section"><h3>操作のヒント</h3><p>味方は盤面または部隊リストから選択。敵を選ぶと能力を確認できます。PCは盤面で矢印キー＋Enter、行動は M=移動 / A=攻撃 / S=技 / C=占拠 / H=シールド / R=回復 / W=待機 / U=移動取消。Escで選択解除。</p></div>`}

const FONT='"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif';

function init3D(){

  const d=new THREE.DirectionalLight(0xffffff,.8);d.position.set(-7,15,9);d.castShadow=true;d.shadow.mapSize.set(1024,1024);

function build3D(){
  if(G3.world){G3.scene.remove(G3.world);disposeTree(G3.world);}
  const w=new THREE.Group();G3.world=w;G3.scene.add(w);
  Object.assign(G3,{tiles:[],units:new Map(),relays:[],bases:{},pickables:[],prev:new Map(),fx:[],prevBase:{P:S.base.P.hp,E:S.base.E.hp}});
  const tg=new THREE.BoxGeometry(.94,.2,.94);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const tr=S.terr[y][x];
    if(tr===1){const h=.9+((x*7+y*13)%5)*.38,m=new THREE.Mesh(new THREE.BoxGeometry(.84,h,.84),new THREE.MeshStandardMaterial({color:C3.bld,roughness:.75,metalness:.15}));
      m.position.set(wx(x),h/2-.1,wz(y));m.castShadow=m.receiveShadow=true;m.userData={x,y};
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x86a3ab,transparent:true,opacity:.45}));m.add(e);
      const cap=new THREE.Mesh(new THREE.BoxGeometry(.5,.06,.5),new THREE.MeshStandardMaterial({color:0x9fd9cf,emissive:0x2f6f66,emissiveIntensity:.6}));cap.position.y=h/2+.03;m.add(cap);
      w.add(m);G3.pickables.push(m);continue;}
    const m=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({color:C3.tile,roughness:.8}));m.position.set(wx(x),-.1,wz(y));m.receiveShadow=true;m.userData={x,y,tile:true};w.add(m);G3.tiles.push(m);G3.pickables.push(m);
    if(tr===2){const team=y===0?'E':'P',col=team==='P'?C3.pU:C3.eU,g=new THREE.Group();g.position.set(wx(x),0,wz(y));g.userData={x,y};
      const mat=new THREE.MeshStandardMaterial({color:col,roughness:.4,metalness:.3});

      const t2=new THREE.Mesh(new THREE.CylinderGeometry(.26,.34,1.1,6),mat);t2.position.y=1.05;
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.36,.04,8,24),new THREE.MeshBasicMaterial({color:col}));ring.rotation.x=Math.PI/2;ring.position.y=1.7;

      w.add(g);G3.pickables.push(g);G3.bases[team]={g,lab,ring,hp:null};}}

    const pad=new THREE.Mesh(new THREE.RingGeometry(.28,.42,4),new THREE.MeshBasicMaterial({color:C3.gold,side:THREE.DoubleSide,transparent:true,opacity:.85}));pad.rotation.x=-Math.PI/2;pad.rotation.z=Math.PI/4;pad.position.y=.02;
    const lab=spriteOf(textTex(r.label,'#f2cd7e',40),.7,.2);lab.position.y=1.6;

  const sel=new THREE.Mesh(new THREE.RingGeometry(.36,.46,32),new THREE.MeshBasicMaterial({color:C3.gold,side:THREE.DoubleSide,transparent:true}));sel.rotation.x=-Math.PI/2;sel.position.y=.03;sel.visible=false;w.add(sel);G3.selRing=sel;

function accessory(cls,mat,acc){const g=new THREE.Group(),M=(geo,m=acc)=>{const o=new THREE.Mesh(geo,m);o.castShadow=true;g.add(o);return o;};
  if(cls==='blade'){const b=M(new THREE.BoxGeometry(.06,.7,.12));b.position.set(.32,.62,0);b.rotation.z=-.35;const h=M(new THREE.BoxGeometry(.18,.05,.14),mat);h.position.set(.24,.32,0);h.rotation.z=-.35;}
  else if(cls==='morph'){for(const s of[-1,1]){const c=M(new THREE.ConeGeometry(.07,.42,8));c.position.set(.3*s,.5,.05);c.rotation.z=-.8*s;}}

  else if(cls==='guard'){const s=M(new THREE.BoxGeometry(.56,.6,.05),new THREE.MeshStandardMaterial({color:0x9ff3ff,transparent:true,opacity:.45,emissive:0x2aa8c0,emissiveIntensity:.5}));s.position.set(0,.5,.34);}
  return g;}
function makeUnit(u){const col=u.team==='P'?C3.pU:C3.eU,mat=new THREE.MeshStandardMaterial({color:col,roughness:.45,metalness:.1,transparent:true}),acc=new THREE.MeshStandardMaterial({color:0xdfe9ec,roughness:.3,metalness:.6,transparent:true});
  const g=new THREE.Group(),add=(geo,y)=>{const o=new THREE.Mesh(geo,mat);o.position.y=y;o.castShadow=true;g.add(o);return o;};
  add(new THREE.CylinderGeometry(.34,.38,.12,24),.06);add(new THREE.CylinderGeometry(.16,.25,.55,16),.4);add(new THREE.SphereGeometry(.17,16,12),.8);
  const a=accessory(u.cls,mat,acc);g.add(a);g.rotation.y=u.team==='E'?Math.PI:0;
  const lab=spriteOf(unitTex(u),1.15,.48);lab.position.y=1.45;g.add(lab);
  g.position.set(wx(u.x),0,wz(u.y));g.userData={x:u.x,y:u.y,id:u.id,mat,acc,col,lab,sig:'',from:null,to:null,k:1,orbit:a.getObjectByName('orbit')};
  G3.world.add(g);G3.pickables.push(g);return g;}
function floatText(txt,color,x,z,y=1.9){const s=spriteOf(textTex(txt,color),1.4,.4);s.position.set(x,y,z);G3.world.add(s);G3.fx.push({o:s,t:0,dur:1.1,kind:'float',y0:y});}
function bailBeam(x,z,team){const col=team==='P'?0x8ff7df:0xffb3a5;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,1,16,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set(x,.5,z);G3.world.add(m);G3.fx.push({o:m,t:0,dur:1.3,kind:'beam'});floatText('緊急脱出',team==='P'?'#8ff7df':'#ffb3a5',x,z,2.3);}
function sync3D(){if(!G3.ok||!S||!G3.renderer)return;if(G3.built!==S){G3.built=S;build3D();}
  const hi=highlights(),k=t=>t.x+','+t.y,mv=new Set(hi.mv.map(k)),tg=new Set(hi.tg.map(k)),sk=new Set(hi.sk.map(k));
  for(const m of G3.tiles){const{x,y}=m.userData,key=x+','+y,o=S.owner[y][x],mat=m.material;
    mat.color.setHex(o==='P'?C3.P:o==='E'?C3.E:C3.tile);mat.emissive.setHex(0);m.position.y=-.1;
    if(mv.has(key)){mat.color.setHex(C3.mv);mat.emissive.setHex(0x1d5b74);m.position.y=-.06;}
    if(sk.has(key)){mat.color.setHex(C3.sk);mat.emissive.setHex(0x5a4416);}
    if(tg.has(key)){mat.emissive.setHex(0x8a2414);m.position.y=-.04;}}
  G3.world.children.filter(b=>b.userData&&b.userData.tg).forEach(b=>{G3.world.remove(b);disposeTree(b);});
  for(const t of hi.tg){const r=new THREE.Mesh(new THREE.RingGeometry(.4,.48,4),new THREE.MeshBasicMaterial({color:0xff9a6b,side:THREE.DoubleSide,transparent:true}));r.rotation.x=-Math.PI/2;r.rotation.z=Math.PI/4;r.position.set(wx(t.x),.05,wz(t.y));r.userData={tg:true,x:t.x,y:t.y};G3.world.add(r);}
  const seen=new Set();
  for(const u of S.units){const vis=u.alive&&!(u.team==='E'&&u.hidden),prev=G3.prev.get(u.id);let g=G3.units.get(u.id);
    if(prev&&prev.alive&&!u.alive){const p=g?g.position:new THREE.Vector3(wx(prev.x),0,wz(prev.y));if(prev.t>u.t)floatText(`-${prev.t-Math.max(0,u.t)}`,'#ffd27a',p.x,p.z);bailBeam(p.x,p.z,u.team);}
    else if(prev&&vis&&u.t<prev.t){const p=g?g.position:{x:wx(u.x),z:wz(u.y)};floatText(`-${prev.t-u.t}`,'#ffd27a',p.x,p.z);}
    else if(prev&&vis&&u.t>prev.t&&g){floatText(`+${u.t-prev.t}`,'#8ff7df',g.position.x,g.position.z);}
    G3.prev.set(u.id,{alive:u.alive,t:u.t,x:u.x,y:u.y});
    if(!vis){if(g){G3.world.remove(g);disposeTree(g);G3.units.delete(u.id);G3.pickables=G3.pickables.filter(p=>p!==g);}continue;}

    if(d.x!==u.x||d.y!==u.y){d.from=g.position.clone();d.to=new THREE.Vector3(wx(u.x),0,wz(u.y));d.k=0;d.x=u.x;d.y=u.y;}
    const dim=u.team==='P'&&u.acted;d.mat.color.setHex(d.col);if(dim)d.mat.color.multiplyScalar(.55);
    const op=u.hidden?.4:1;d.mat.opacity=op;d.acc.opacity=op;
    const sig=[u.t,u.shield,u.acted].join();if(sig!==d.sig){d.sig=sig;d.lab.material.map.dispose();d.lab.material.map=unitTex(u);d.lab.material.needsUpdate=true;}}
  const su=selU();if(su&&G3.units.get(su.id)){G3.selRing.visible=true;G3.selRing.userData.follow=su.id;}else G3.selRing.visible=false;
  for(const t of['P','E']){const B=G3.bases[t];if(!B)continue;const hp=S.base[t].hp;
    if(B.hp!==hp){if(B.hp!==null&&hp<B.hp)floatText(`-${B.hp-hp}`,'#ffd27a',B.g.position.x,B.g.position.z,2.6);B.hp=hp;B.lab.material.map.dispose();B.lab.material.map=textTex(`基地 ${hp}`,t==='P'?'#65e5c7':'#f38b80');B.lab.material.needsUpdate=true;}}
  for(const R of G3.relays){const o=R.r.owner,c=o==='P'?C3.pU:o==='E'?C3.eU:C3.gold;R.gem.material.color.setHex(c);R.gem.material.emissive.setHex(c);R.pad.material.color.setHex(c);}
}
function loop(now){requestAnimationFrame(loop);const cv=G3.renderer&&G3.renderer.domElement;if(!cv||!cv.isConnected||document.hidden){G3.last=now;return;}
  const dt=Math.min(.05,((now-(G3.last||now))/1000));G3.last=now;const T=now/1000,c=G3.cam,cam=G3.camera;
  cam.position.set(c.r*Math.cos(c.el)*Math.sin(c.az),c.r*Math.sin(c.el),c.r*Math.cos(c.el)*Math.cos(c.az)+.6);cam.lookAt(0,0,.6);
  if(G3.world){for(const g of G3.units.values()){const d=g.userData;if(d.k<1&&d.to){d.k=Math.min(1,d.k+dt*3.2);const e=d.k<.5?2*d.k*d.k:1-Math.pow(-2*d.k+2,2)/2;g.position.lerpVectors(d.from,d.to,e);g.position.y=Math.sin(Math.PI*d.k)*.55;}
      if(d.orbit)d.orbit.rotation.y=T*1.6;}
    for(const R of G3.relays){R.gem.rotation.y=T*1.2;R.gem.position.y=1.15+Math.sin(T*2+R.r.x)*.08;}
    for(const B of Object.values(G3.bases))B.ring.position.y=1.7+Math.sin(T*1.5)*.06;
    const sr=G3.selRing;if(sr.visible){const g=G3.units.get(sr.userData.follow);if(g){sr.position.x=g.position.x;sr.position.z=g.position.z;}const s=1+Math.sin(T*5)*.08;sr.scale.set(s,s,s);}
    for(const o of G3.world.children)if(o.userData&&o.userData.tg)o.material.opacity=.55+Math.sin(T*6)*.35;
    G3.fx=G3.fx.filter(f=>{f.t+=dt;const p=f.t/f.dur;
      if(f.kind==='float'){f.o.position.y=f.y0+p*.9;f.o.material.opacity=p<.7?1:1-(p-.7)/.3;}
      else{const grow=Math.min(1,p/.2);f.o.scale.set(1-p*.6,1+grow*16,1-p*.6);f.o.position.y=f.o.scale.y/2;f.o.material.opacity=p<.3?.9:.9*(1-(p-.3)/.7);}
      if(p>=1){G3.world.remove(f.o);disposeTree(f.o);return false;}return true;});}
  G3.renderer.render(G3.scene,cam);}
function bindPointer(cv){const pts=new Map();let drag=false,start=null,pinch0=0,r0=0;
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){drag=false;start={x:e.clientX,y:e.clientY};}else if(pts.size===2){const[a,b]=[...pts.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=G3.cam.r;drag=true;}});
  cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(pts.size>=2){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0&&d)G3.cam.r=clamp3(r0*pinch0/d,9,32);return;}
    if(!drag&&start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>12)drag=true;
    if(drag){G3.cam.az-=dx*.008;G3.cam.el=clamp3(G3.cam.el+dy*.006,.32,1.45);}});
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size===0){if(!drag&&e.type==='pointerup')pick3D(e);drag=false;pinch0=0;}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();G3.cam.r=clamp3(G3.cam.r*(1+Math.sign(e.deltaY)*.08),9,32);},{passive:false});}
function pick3D(e){if(!S||!G3.world)return;const cv=G3.renderer.domElement,rc=cv.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
  const ray=new THREE.Raycaster();ray.setFromCamera(v,G3.camera);
  const solid=[];for(const g of G3.units.values())g.traverse(n=>{if(n.isMesh)solid.push(n)});for(const B of Object.values(G3.bases))B.g.traverse(n=>{if(n.isMesh)solid.push(n)});
  const cell=o=>{while(o&&o.userData.x===undefined)o=o.parent;return o?o.userData:null;};
  let h=ray.intersectObjects(solid,false)[0],c=h&&cell(h.object);
  if(!c){h=ray.intersectObjects(G3.tiles,false)[0];c=h&&h.object.userData;}
  if(!c){const pt=new THREE.Vector3();if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),pt)){const x=Math.round(pt.x+(W-1)/2),y=Math.round(pt.z+(H-1)/2);if(inb(x,y))c={x,y};}}
  if(c)onTile(c.x,c.y);}
function resize3D(){const cv=G3.renderer&&G3.renderer.domElement,slot=cv&&cv.parentElement;if(!slot)return;const w=slot.clientWidth;if(!w)return;
  const h=Math.round(Math.min(w*1.22,window.innerHeight*.74));G3.renderer.setSize(w,h);G3.camera.aspect=w/h;G3.camera.updateProjectionMatrix();}
function mount3D(){const slot=document.getElementById('scene-slot');if(!slot||!G3.ok)return;if(!G3.renderer)init3D();
  slot.appendChild(G3.renderer.domElement);G3.ro.disconnect();G3.ro.observe(slot);resize3D();sync3D();}
