<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひみつの花の謎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EA; --ink:#1E3A2A; --sub:#5E7465; --rose:#C8375A; --card:#FFFFFF; --line:#CFD9CC; --soft:#E2EADF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131E17; --ink:#E4EEE5; --sub:#9DB2A2; --rose:#F07A95; --card:#1C2A21; --line:#2E4035; --soft:#243429;
  }
}
:root[data-theme="dark"]{
  --bg:#131E17; --ink:#E4EEE5; --sub:#9DB2A2; --rose:#F07A95; --card:#1C2A21; --line:#2E4035; --soft:#243429;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  font-weight:500; line-height:1.75; -webkit-text-size-adjust:100%;
}
main{max-width:460px; margin:0 auto; padding:20px 18px 40px}
h1{
  font-family:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:1.9rem; line-height:1.3; margin:8px 0 4px; letter-spacing:.04em;
}
.lead{color:var(--sub); margin:0 0 18px; font-size:.95rem}

/* 収集スロット */
.slots{display:flex; gap:10px; align-items:center; margin:0 0 22px}
.slot{
  width:52px; height:52px; border-radius:50%;
  border:2px dashed var(--line); display:grid; place-items:center;
  font-size:1.6rem; color:var(--sub); background:var(--soft);
  transition:transform .35s ease, border-color .35s;
}
.slot.got{border:2px solid var(--rose); background:var(--card); transform:scale(1.08)}
.slot.final{margin-left:auto; border-radius:14px}
.plus{color:var(--sub); font-size:1.1rem}

.panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px 18px}
.qno{font-family:"Kaisei Decol",serif; color:var(--rose); font-size:1.05rem; margin:0 0 6px}
.qtext{margin:0 0 14px}
.stage{
  background:var(--soft); border-radius:12px; padding:18px 12px; text-align:center; margin-bottom:16px;
}
.big{font-size:1.9rem; letter-spacing:.18em; font-weight:700}
.emoji{font-size:2.6rem; line-height:1.2}
.keypad{display:grid; grid-template-columns:repeat(3,56px); gap:8px; justify-content:center; margin-top:14px}
.key{
  height:44px; border-radius:10px; background:var(--card); border:1px solid var(--line);
  display:grid; place-items:center; font-weight:700; line-height:1.1; font-size:1.05rem
}
.key small{display:block; font-size:.62rem; color:var(--rose); font-weight:700}
.kanji-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap}
.kbox{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; font-size:1.3rem; font-weight:700; white-space:nowrap
}
.blank{display:inline-block; width:1.2em; height:1.2em; border:2px solid var(--rose); border-radius:4px; vertical-align:-3px}

.row{display:flex; gap:8px}
input{
  flex:1; min-width:0; font:inherit; font-size:16px; padding:12px 14px;
  border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
}
input:focus-visible,button:focus-visible{outline:3px solid var(--rose); outline-offset:2px}
button{
  font:inherit; font-weight:700; border:none; border-radius:12px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.go{background:var(--rose); color:#fff; padding:12px 18px}
.hintbtn{background:none; color:var(--sub); padding:10px 0; text-decoration:underline; text-underline-offset:3px}
.msg{min-height:1.6em; margin:10px 0 0; font-weight:700}
.msg.ng{color:var(--rose)}
.hints p{margin:6px 0 0; padding:8px 12px; background:var(--soft); border-radius:10px; font-size:.92rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.clear{text-align:center}
.clear .emoji{font-size:4rem}
.clear h2{font-family:"Kaisei Decol",serif; font-size:1.6rem; margin:6px 0}
.clear p{margin:8px 0}
.time{font-size:1.2rem; font-weight:700; color:var(--rose)}
.explain{text-align:left; background:var(--soft); border-radius:12px; padding:12px 14px; font-size:.92rem}
.again{background:var(--soft); color:var(--ink); padding:12px 20px; margin-top:12px; border:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>ひみつの花の謎</h1>
  <p class="lead">3つの謎を解くと、最後の扉がひらく。答えはひらがな・カタカナ・漢字どれでもOK。</p>

  <div class="slots" aria-label="集めた答え">
    <div class="slot" id="s0">？</div>
    <div class="slot" id="s1">？</div>
    <div class="slot" id="s2">？</div>
    <span class="plus">→</span>
    <div class="slot final" id="s3">🔒</div>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<script>
const Q = [
  {
    no:"第1問", emoji:"🍓",
    text:"たぬきが何かを伝えようとしている。何と言っている？",
    stage:`<div class="emoji">🦝</div><div class="big">たいたちたご</div>`,
    ans:["いちご","苺"],
    hints:["たぬき＝「た」を抜く","「た」を全部消すと…"]
  },
  {
    no:"第2問", emoji:"🌸",
    text:"昔の携帯電話に、こんな暗号が届いた。何と書いてある？",
    stage:`<div class="big" style="letter-spacing:.1em">3-1　2-3　9-1</div>
      <div class="keypad" aria-hidden="true">
        <div class="key">1<small>あ</small></div><div class="key">2</div><div class="key">3</div>
        <div class="key">4</div><div class="key">5</div><div class="key">6</div>
        <div class="key">7</div><div class="key">8</div><div class="key">9</div>
        <div class="key" style="grid-column:2">0</div>
      </div>`,
    ans:["さくら","桜"],
    hints:["ボタン1は「あ行」。では2は？","「2-3」は、か行の3番目＝「く」"]
  },
  {
    no:"第3問", emoji:"🍑",
    text:"□に共通して入る漢字1文字を、読みで答えよ。",
    stage:`<div class="kanji-row">
      <span class="kbox"><span class="blank"></span>色</span>
      <span class="kbox"><span class="blank"></span>太郎</span>
      <span class="kbox">白<span class="blank"></span></span>
    </div>`,
    ans:["もも","桃"],
    hints:["昔話の主人公がヒント","川から流れてきた果物"]
  },
  {
    no:"最終問題", emoji:"🌹",
    text:"集めた3つの答えは、じつは全員「ある花」の仲間。その花とは？",
    stage:`<div class="emoji" id="trio">🍓 🌸 🍑</div><div style="margin-top:6px;color:var(--sub)">いちご・さくら・もも</div>`,
    ans:["ばら","薔薇","ばらか","薔薇科"],
    hints:["植物の「〇〇科」という分類で考えよう","トゲがあって、愛を伝える花"]
  }
];

let step = 0, hintShown = 0, start = Date.now();
const panel = document.getElementById("panel");

function norm(s){
  return s.trim().replace(/[\s　]/g,"")
    .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
}

function render(){
  const q = Q[step]; hintShown = 0;
  panel.innerHTML = `
    <p class="qno">${q.no}</p>
    <p class="qtext">${q.text}</p>
    <div class="stage">${q.stage}</div>
    <div class="row">
      <input id="inp" type="text" placeholder="答えを入力" autocomplete="off" autocapitalize="off" enterkeyhint="done" aria-label="答え">
      <button class="go" id="go">答える</button>
    </div>
    <p class="msg" id="msg"></p>
    <button class="hintbtn" id="hb">ヒントを見る（${q.hints.length}つ）</button>
    <div class="hints" id="hints"></div>`;
  document.getElementById("go").onclick = check;
  document.getElementById("inp").addEventListener("keydown", e => { if(e.key==="Enter" && !e.isComposing) check(); });
  document.getElementById("hb").onclick = showHint;
}

function showHint(){
  const q = Q[step];
  if(hintShown >= q.hints.length) return;
  const p = document.createElement("p");
  p.textContent = "ヒント" + (hintShown+1) + "：" + q.hints[hintShown];
  document.getElementById("hints").appendChild(p);
  hintShown++;
  const hb = document.getElementById("hb");
  if(hintShown >= q.hints.length) hb.style.display = "none";
  else hb.textContent = "次のヒントを見る";
}

function check(){
  const inp = document.getElementById("inp");
  const msg = document.getElementById("msg");
  const v = norm(inp.value);
  if(!v){ msg.className="msg ng"; msg.textContent="答えを入力してください"; return; }
  if(Q[step].ans.map(norm).includes(v)){
    const slot = document.getElementById("s"+step);
    slot.textContent = Q[step].emoji; slot.classList.add("got");
    step++;
    if(step < Q.length) render(); else finish();
  } else {
    msg.className = "msg ng"; msg.textContent = "ちがうようだ。もう一度考えてみよう";
    inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
  }
}

function finish(){
  const sec = Math.round((Date.now()-start)/1000);
  const t = Math.floor(sec/60) + "分" + (sec%60) + "秒";
  panel.innerHTML = `
    <div class="clear">
      <div class="emoji">🌹</div>
      <h2>謎、解けました</h2>
      <p>クリアタイム <span class="time">${t}</span></p>
      <div class="explain">いちご・さくら・ももは、どれも植物分類で「バラ科」。見た目も季節もばらばらなのに、じつは同じ仲間でした。ほかにもりんご・なし・うめもバラ科です。</div>
      <button class="again" id="again">もう一度あそぶ</button>
    </div>`;
  document.getElementById("again").onclick = () => {
    step = 0; start = Date.now();
    ["s0","s1","s2"].forEach(id => { const s=document.getElementById(id); s.textContent="？"; s.classList.remove("got"); });
    const f = document.getElementById("s3"); f.textContent="🔒"; f.classList.remove("got");
    render();
  };
}

render();
</script>
</body>
</html>
