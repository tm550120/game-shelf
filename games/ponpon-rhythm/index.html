<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽんぽんリズム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b2748; --water:#213767; --moon:#ffe27a; --leader:#3e9a5c; --player:#a3d94b;
  --pad:#2d6a44; --sac:#f5e3bf; --ink:#fff8e6; --mouth:#4a1a2a; --dim:#a6b5d8; --hot:#ff8fa3;
  --wall:#e8f2ec; --floor:#a9b3ae; --frame:#b8ccc4; --seat:#d95b6a; --seatBack:#c64a5a; --seatFront:#b33f4e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#16213f; --water:#1c305b; } }
:root[data-theme="dark"]{ --night:#16213f; --water:#1c305b; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
*{box-sizing:border-box;}
body{
  background:var(--night); color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  overflow:hidden; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.display{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400;}

#stage{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(var(--night) 0 48%, var(--water) 48% 100%);}
#stage.train{--ink:#2b3b3a;--dim:#5f7470;background:var(--wall);}
.trainOnly{display:none!important;}
#stage.train .trainOnly{display:block!important;}
#stage.train .frogOnly{display:none!important;}

.moon{position:absolute;top:9%;right:12%;width:64px;height:64px;border-radius:50%;background:var(--moon);box-shadow:0 0 40px rgba(255,226,122,.35);}
.shine{position:absolute;right:calc(12% + 8px);height:4px;border-radius:4px;background:var(--moon);opacity:.35;}

.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 0;}
#counter{font-size:14px;color:var(--dim);font-weight:800;}
#phase{position:relative;z-index:1;text-align:center;font-size:clamp(30px,10vw,52px);margin-top:3vh;min-height:1.3em;letter-spacing:.04em;color:var(--ink);}

.pond{position:relative;flex:1;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4% 16vh;}
.fwrap{position:relative;width:44%;max-width:260px;transition:filter .2s;}
.fwrap.leader{width:48%;}
.fwrap svg{display:block;width:100%;height:auto;overflow:visible;}
#stage.listen .fwrap.me, #stage.repeat .fwrap.leader{filter:brightness(.7) saturate(.8);}
.sac{transform-box:fill-box;transform-origin:50% 10%;transform:scale(.2,.05);transition:transform .05s ease-out;}
.frog.c .sac{transform:scale(1);}
.mouth-open{opacity:0;}
.frog.c .mouth-open{opacity:1;}
.frog.c .mouth-closed{opacity:0;}
.ring{position:absolute;left:50%;bottom:4%;width:70%;aspect-ratio:3/1;margin-left:-35%;border:3px solid var(--ink);border-radius:50%;opacity:0;pointer-events:none;}
.ring.go{animation:ring .45s ease-out;}
@keyframes ring{from{transform:scale(.6);opacity:.6}to{transform:scale(1.4);opacity:0}}

.fb{position:absolute;text-align:center;font-size:clamp(20px,6vw,30px);opacity:0;pointer-events:none;z-index:2;}
#fb{left:0;right:0;top:-18%;}
#tfb{right:5%;top:36%;}
.fb.go{animation:pop .55s ease-out;}
.fb.perfect{color:var(--moon);} .fb.good{color:var(--player);} .fb.near{color:var(--dim);} .fb.miss{color:var(--hot);}
#stage.train .fb.perfect{color:#e08a1e;} #stage.train .fb.good{color:#2f8f45;} #stage.train .fb.miss{color:#d9435a;}
@keyframes pop{0%{transform:translateY(8px) scale(.8);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-14px);opacity:0}}

#trainScene{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
#doorP{transition:transform .18s ease-out;}
#doorP.open{transform:translateX(-54px);}
#pax,#kid{transition:transform .32s cubic-bezier(.3,1.25,.5,1),opacity .25s;}

.toast{position:absolute;z-index:3;left:50%;top:30%;transform:translateX(-50%);width:max-content;max-width:86%;text-align:center;background:rgba(20,30,50,.85);color:#fff8e6;font-size:14px;line-height:1.6;padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.hint{position:absolute;z-index:1;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--dim);}
#stage.train .hint{color:#4a5a57;}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:rgba(18,28,56,.93);z-index:10;color:#fff8e6;}
.overlay[hidden]{display:none;}
.card{max-width:350px;width:100%;text-align:center;margin:auto;}
.card h1{font-size:clamp(36px,11vw,48px);line-height:1.15;margin:0 0 18px;color:#a3d94b;}
.card p{margin:0 0 14px;line-height:1.75;font-size:15px;}
.small{font-size:13px;color:#a6b5d8;}
.stagebtn{display:block;width:100%;text-align:left;font:inherit;color:#fff8e6;background:rgba(255,255,255,.06);
  border:2px solid #a3d94b;border-radius:18px;padding:14px 16px;margin:0 0 12px;cursor:pointer;}
.stagebtn:nth-of-type(2){border-color:#ff9aa8;}
.stagebtn b{display:block;font-size:21px;margin-bottom:4px;}
.stagebtn span{display:block;font-size:13px;line-height:1.6;color:#c9d3ea;}
.stagebtn:active{transform:scale(.98);}
.stagebtn:focus-visible,button.go:focus-visible{outline:3px solid #fff8e6;outline-offset:3px;}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;margin:14px 0 4px;}
.chk input{width:20px;height:20px;accent-color:#a3d94b;}
label.adj{display:block;font-size:13px;color:#a6b5d8;margin:14px 0 4px;line-height:1.6;}
input[type=range]{width:100%;accent-color:#a3d94b;}
button.go{font:inherit;font-weight:800;font-size:19px;color:#1b2748;background:#ffe27a;border:0;border-radius:40px;
  padding:13px 36px;margin:10px 6px 0;cursor:pointer;box-shadow:0 5px 0 #c9a93e;}
button.go.sub{background:#dfe6f5;box-shadow:0 5px 0 #9ea9c2;}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a93e;}
#rank{font-size:clamp(28px,8.5vw,38px);color:#ffe27a;margin:4px 0 6px;}
#pct{font-size:56px;margin:0;line-height:1;}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 18px;margin:18px auto 8px;max-width:240px;font-size:15px;text-align:left;}
.stats span:nth-child(even){text-align:right;font-weight:800;}
@media (prefers-reduced-motion: reduce){ .fb.go,.ring.go{animation-duration:.01s;} }
</style>
</head>
<body>
<div id="stage" class="frog">
  <div class="moon frogOnly"></div>
  <div class="shine frogOnly" style="top:52%;width:70px"></div>
  <div class="shine frogOnly" style="top:55%;width:44px;right:calc(12% + 20px)"></div>

  <svg id="trainScene" class="trainOnly" viewBox="0 0 360 640" preserveAspectRatio="xMidYMax meet" aria-label="電車の中">
    <defs>
      <clipPath id="winClip"><rect x="80" y="165" width="262" height="140" rx="14"/></clipPath>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3f4"/><stop offset="1" stop-color="#d9f2fb"/></linearGradient>
    </defs>
    <g id="room">
      <rect x="-500" y="-500" width="1360" height="1045" fill="var(--wall)"/>
      <rect x="-500" y="545" width="1360" height="500" fill="var(--floor)"/>
      <rect x="-500" y="540" width="1360" height="6" fill="#86928d"/>
      <g clip-path="url(#winClip)">
        <rect x="80" y="165" width="262" height="140" fill="url(#sky)"/>
        <circle cx="305" cy="198" r="14" fill="#fff4b8"/>
        <g id="hills"></g>
        <rect x="80" y="284" width="262" height="21" fill="#7ccf6e"/>
        <g id="poles"></g>
      </g>
      <rect x="80" y="165" width="262" height="140" rx="14" fill="none" stroke="var(--frame)" stroke-width="8"/>
      <line x1="60" y1="118" x2="600" y2="118" stroke="#b7c4bf" stroke-width="5" stroke-linecap="round"/>
      <g stroke-linecap="round">
        <line x1="120" y1="118" x2="120" y2="138" stroke="#cfd9d5" stroke-width="3"/><circle cx="120" cy="147" r="9" fill="none" stroke="#f0c948" stroke-width="4"/>
        <line x1="190" y1="118" x2="190" y2="138" stroke="#cfd9d5" stroke-width="3"/><circle cx="190" cy="147" r="9" fill="none" stroke="#f0c948" stroke-width="4"/>
        <line x1="260" y1="118" x2="260" y2="138" stroke="#cfd9d5" stroke-width="3"/><circle cx="260" cy="147" r="9" fill="none" stroke="#f0c948" stroke-width="4"/>
        <line x1="330" y1="118" x2="330" y2="138" stroke="#cfd9d5" stroke-width="3"/><circle cx="330" cy="147" r="9" fill="none" stroke="#f0c948" stroke-width="4"/>
      </g>
      <rect x="-4" y="164" width="60" height="381" fill="#fff1c2"/>
      <rect x="-4" y="470" width="60" height="75" fill="#d8cfae"/>
      <g id="doorP">
        <rect x="-2" y="166" width="56" height="379" rx="4" fill="#dfe8e4" stroke="#aebdb7" stroke-width="3"/>
        <rect x="10" y="200" width="32" height="120" rx="6" fill="#bfe6f5"/>
      </g>
      <rect x="-500" y="160" width="496" height="385" fill="var(--wall)"/>
      <rect x="-8" y="158" width="72" height="8" rx="3" fill="var(--frame)"/>
      <rect x="170" y="392" width="300" height="90" rx="14" fill="var(--seatBack)"/>
      <rect x="160" y="468" width="310" height="28" rx="12" fill="var(--seat)"/>
      <rect x="168" y="494" width="302" height="52" fill="var(--seatFront)"/>
      <g id="pax"></g>
      <g id="kid"></g>
    </g>
  </svg>

  <div class="top"><span id="counter"></span><span></span></div>
  <div id="phase" class="display"></div>

  <div class="pond frogOnly">
    <div class="fwrap leader" id="leaderWrap">
      <svg viewBox="0 0 200 200" class="frog" id="leaderFrog" aria-label="お手本のカエル">
        <ellipse cx="100" cy="182" rx="98" ry="16" fill="var(--pad)"/>
        <ellipse cx="100" cy="120" rx="78" ry="58" fill="var(--leader)"/>
        <circle cx="60" cy="68" r="25" fill="var(--leader)"/><circle cx="140" cy="68" r="25" fill="var(--leader)"/>
        <circle cx="60" cy="66" r="15" fill="#fff"/><circle cx="140" cy="66" r="15" fill="#fff"/>
        <circle cx="63" cy="68" r="7" fill="#1a1a2a"/><circle cx="137" cy="68" r="7" fill="#1a1a2a"/>
        <path class="mouth-closed" d="M58 122 Q100 142 142 122" fill="none" stroke="var(--mouth)" stroke-width="5" stroke-linecap="round"/>
        <ellipse class="mouth-open" cx="100" cy="126" rx="26" ry="13" fill="var(--mouth)"/>
        <ellipse class="sac" cx="100" cy="158" rx="40" ry="28" fill="var(--sac)"/>
      </svg>
    </div>
    <div class="fwrap me" id="meWrap">
      <div id="fb" class="fb display"></div>
      <div class="ring" id="ring"></div>
      <svg viewBox="0 0 200 200" class="frog" id="meFrog" aria-label="あなたのカエル">
        <ellipse cx="100" cy="182" rx="90" ry="14" fill="var(--pad)"/>
        <ellipse cx="100" cy="124" rx="72" ry="54" fill="var(--player)"/>
        <circle cx="64" cy="76" r="23" fill="var(--player)"/><circle cx="136" cy="76" r="23" fill="var(--player)"/>
        <circle cx="64" cy="74" r="14" fill="#fff"/><circle cx="136" cy="74" r="14" fill="#fff"/>
        <circle cx="61" cy="76" r="7" fill="#1a1a2a"/><circle cx="133" cy="76" r="7" fill="#1a1a2a"/>
        <path class="mouth-closed" d="M64 126 Q100 144 136 126" fill="none" stroke="var(--mouth)" stroke-width="5" stroke-linecap="round"/>
        <ellipse class="mouth-open" cx="100" cy="130" rx="24" ry="12" fill="var(--mouth)"/>
        <ellipse class="sac" cx="100" cy="160" rx="36" ry="25" fill="var(--sac)"/>
      </svg>
    </div>
  </div>
  <div id="tfb" class="fb display trainOnly"></div>
  <div id="toast" class="toast"></div>
  <div class="hint frogOnly" id="hintFrog">画面のどこでもタップで「ケロッ」</div>
  <div class="hint trainOnly" id="hintTrain">おばあちゃんにだけ「どうぞ」でタップ</div>
</div>

<div class="overlay" id="startOv">
  <div class="card">
    <h1 class="display">ぽんぽん<br>リズム</h1>
    <button class="stagebtn" data-stage="frog"><b class="display">カエルのこだま</b><span>左のカエルが鳴いたリズムを、次の小節でまねしよう。</span></button>
    <button class="stagebtn" data-stage="train"><b class="display">でんしゃで どうぞ</b><span>おばあちゃんが乗ってきたら「ピン・ポン・どうぞ！」の「どうぞ」でタップ。ほかの人にはゆずらないでね。</span></button>
    <label class="chk"><input type="checkbox" id="voiceOn" checked> 声の合図を出す</label>
    <label class="chk"><input type="checkbox" id="shakeOn"> スマホを振って操作する</label>
    <label class="adj" for="offset">タイミング調整：<span id="offVal">0</span>ms<br>（いつも「おしい」が出るなら動かしてみて）</label>
    <input type="range" id="offset" min="-150" max="150" step="10" value="0">
    <p class="small" style="margin-top:12px">音を出して遊んでね。</p>
  </div>
</div>

<div class="overlay" id="resultOv" hidden>
  <div class="card">
    <p class="small">けっか</p>
    <p id="pct" class="display">0</p>
    <p id="rank" class="display"></p>
    <div class="stats" id="stats"></div>
    <button class="go" id="againBtn">もう一回</button>
    <button class="go sub" id="menuBtn">ステージをえらぶ</button>
  </div>
</div>

<script>
const BPM = 112, BEAT = 60 / BPM, COUNTIN = 4, WIN = 0.15;
const $ = id => document.getElementById(id);
const stage = $('stage'), phaseEl = $('phase'), counterEl = $('counter'), ring = $('ring');
const leaderFrog = $('leaderFrog'), meFrog = $('meFrog'), leaderWrap = $('leaderWrap'), meWrap = $('meWrap');
const offsetInput = $('offset'), voiceOn = $('voiceOn'), shakeOn = $('shakeOn');
const paxG = $('pax'), kidG = $('kid'), doorP = $('doorP'), hillsG = $('hills'), polesG = $('poles'), roomG = $('room');
let ctx = null, run = null, stageId = 'frog';

offsetInput.addEventListener('input', () => { $('offVal').textContent = offsetInput.value; });

/* ---------- 音 ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function note(dest, t, m, dur, vol, type) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'triangle'; o.frequency.value = mtof(m);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .03);
}
function musicBox(dest, t, m) { note(dest, t, m, .38, .075, 'triangle'); note(dest, t, m + 12, .2, .03, 'sine'); }
function bassNote(dest, t, m) { note(dest, t, m, .24, .11, 'triangle'); }
function bell(dest, t, m, vol) { note(dest, t, m, .7, vol, 'sine'); note(dest, t, m + 19, .3, vol * .25, 'sine'); note(dest, t, m + 12, .4, vol * .3, 'triangle'); }
function buzz(dest, t) {
  const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = mtof(50);
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
  o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + .2);
}
function croak(dest, t, base) {
  const o = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = 'sawtooth'; o2.type = 'square';
  o.frequency.setValueAtTime(base * 1.6, t); o.frequency.exponentialRampToValueAtTime(base, t + .09);
  o2.frequency.setValueAtTime(base * .8, t); o2.frequency.exponentialRampToValueAtTime(base * .5, t + .09);
  f.type = 'lowpass'; f.Q.value = 7;
  f.frequency.setValueAtTime(base * 7, t); f.frequency.exponentialRampToValueAtTime(base * 2.5, t + .14);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + .17);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(dest);
  o.start(t); o2.start(t); o.stop(t + .2); o2.stop(t + .2);
}
function tick(dest, t, accent) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = accent ? 1650 : 1250;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(accent ? .18 : .08, t + .002);
  g.gain.exponentialRampToValueAtTime(.0001, t + .04);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + .06);
}
let noiseBuf = null;
function gatan(dest, t, hi) {
  if (!noiseBuf) {
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .3, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = hi ? 480 : 300; f.Q.value = 2.2;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.7, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + .1);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + .12);
}
function pop(dest, t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1150, t + .06);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .13);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + .15);
}
function sparkle(dest, t) { [91, 95, 98, 103].forEach((m, i) => note(dest, t + i * .045, m, .3, .07, 'sine')); }

/* かわいいメロディ（8分音符×8で1小節、4小節ループ） */
const FROG_MEL = [
  [72,null,76,79,null,76,72,null],[74,null,77,81,null,79,null,null],
  [76,null,79,84,null,83,81,79],[77,76,74,null,72,null,null,null]];
const FROG_BASS = [[48,55,52,55],[50,57,53,57],[48,55,52,55],[55,50,47,50]];
const TRAIN_MEL = [
  [67,71,74,null,71,null,67,null],[69,72,76,null,74,null,null,null],
  [71,74,79,null,78,76,74,null],[72,null,69,null,66,null,67,null]];
const TRAIN_BASS = [[55,50,55,50],[57,52,57,52],[55,50,55,50],[48,55,50,57]];
function scheduleMusic(bus, t0, startBeat, bars, mel, bs) {
  for (let b = 0; b < bars; b++) {
    const k = b % mel.length, base = t0 + (startBeat + b * 4) * BEAT;
    mel[k].forEach((m, i) => { if (m != null) musicBox(bus, base + i * BEAT / 2, m); });
    bs[k].forEach((m, i) => bassNote(bus, base + i * BEAT, m));
  }
}

/* ---------- 声 ---------- */
let jaVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /^ja/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, pitch, rate) {
  if (!voiceOn.checked || !('speechSynthesis' in window)) return;
  try {
    if (speechSynthesis.speaking) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
    u.pitch = pitch == null ? 1.5 : pitch; u.rate = rate == null ? 1.35 : rate; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 共通 ---------- */
function latency() { return (ctx.outputLatency || 0) + (ctx.baseLatency || 0); }
function now() { return ctx.currentTime - run.t0 - latency(); }
function retrigger(el) { el.classList.remove('go'); void el.getBoundingClientRect(); el.classList.add('go'); }
function feedback(text, kind) {
  const el = run.fbEl; el.textContent = text;
  el.classList.remove('perfect', 'good', 'near', 'miss'); el.classList.add(kind); retrigger(el);
}
function judge(d) {
  d = d / run.scale;
  if (d < .045) { run.c.p++; run.pts += 1; feedback('ぴったり', 'perfect'); }
  else if (d < .09) { run.c.g++; run.pts += .75; feedback('いいね', 'good'); }
  else { run.c.n++; run.pts += .4; feedback('おしい', 'near'); }
}

function start(id) {
  if (id) stageId = id;
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if (run) { try { run.bus.disconnect(); } catch (e) {} }
  stage.className = stageId;
  const bus = ctx.createGain(); bus.connect(ctx.destination);
  const t0 = ctx.currentTime + .6;
  const shake = shakeOn.checked && motionOK;
  run = { bus, t0, pts: 0, c: { p: 0, g: 0, n: 0, m: 0, w: 0 }, done: false, offset: +offsetInput.value / 1000,
          shake, win: shake ? .19 : WIN, scale: shake ? 1.3 : 1 };
  $('hintFrog').textContent = shake ? 'スマホを振って「ケロッ」（タップでもOK）' : '画面のどこでもタップで「ケロッ」';
  $('hintTrain').textContent = shake ? 'おばあちゃんにだけ「どうぞ」で振る（タップでもOK）' : 'おばあちゃんにだけ「どうぞ」でタップ';
  gotMotion = false;
  if (shakeOn.checked && !motionOK) toast('モーションセンサーが使えないので、タップで遊んでね');
  else if (shake) setTimeout(() => { if (run && !run.done && !gotMotion) toast('センサーが反応しないので、タップで遊んでね'); }, 1800);
  if (stageId === 'frog') setupFrog(bus, t0); else setupTrain(bus, t0);
  $('startOv').hidden = true; $('resultOv').hidden = true;
  requestAnimationFrame(loop);
}
function loop() {
  if (!run || run.done) return;
  const t = now();
  if (stageId === 'frog') frogFrame(t); else trainFrame(t);
  if (t / BEAT >= run.totalBeats + 1) { finish(); return; }
  requestAnimationFrame(loop);
}
function hit() { if (stageId === 'frog') frogTap(); else trainTap(); }
stage.addEventListener('pointerdown', e => {
  if (!run || run.done) return;
  e.preventDefault(); hit();
});

/* ---------- 振って操作 ---------- */
const SHAKE_HI = 13, SHAKE_LO = 5, SHAKE_GAP = 170;
let motionOK = false, gotMotion = false, armed = true, lastShake = 0;
window.addEventListener('devicemotion', e => {
  if (!run || run.done || !run.shake) return;
  let m;
  const a = e.acceleration;
  if (a && a.x != null) m = Math.hypot(a.x, a.y, a.z);
  else {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.8);
  }
  gotMotion = true;
  const t = performance.now();
  if (armed && m > SHAKE_HI && t - lastShake > SHAKE_GAP) { armed = false; lastShake = t; hit(); }
  else if (!armed && m < SHAKE_LO) armed = true;
});
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600);
}
// ボタンを押した瞬間に音・声・センサーの許可をまとめて取る
function begin(id) {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if (voiceOn.checked && 'speechSynthesis' in window) {
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  }
  if (!shakeOn.checked) { start(id); return; }
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(r => { motionOK = r === 'granted'; start(id); })
      .catch(() => { motionOK = false; start(id); });
  } else { motionOK = typeof DeviceMotionEvent !== 'undefined'; start(id); }
}

/* ---------- ステージ1：カエルのこだま ---------- */
const PATTERNS = [
  [0],[0,2],[0,1,2],[0,2,3],[0,1,2,3],[0,1.5,2],
  [0,.5,1,2],[0,1.5,3],[0,.5,2,2.5],[0,1,1.5,2,3],[.5,1.5,2.5],[0,.5,1,1.5,2]];
function setupFrog(bus, t0) {
  const leader = [], expect = [];
  PATTERNS.forEach((p, i) => {
    const s = COUNTIN + i * 8;
    p.forEach(b => {
      leader.push({ t: (s + b) * BEAT, shown: false });
      expect.push({ t: (s + 4 + b) * BEAT, hit: false, missed: false });
    });
  });
  run.totalBeats = COUNTIN + PATTERNS.length * 8;
  for (let b = 0; b < run.totalBeats; b++) tick(bus, t0 + b * BEAT, b % 4 === 0);
  leader.forEach(n => croak(bus, t0 + n.t, 150));
  scheduleMusic(bus, t0, COUNTIN, PATTERNS.length * 2, FROG_MEL, FROG_BASS);
  Object.assign(run, { leader, expect, fbEl: $('fb') });
}
function croakVis(svg) {
  svg.classList.add('c'); clearTimeout(svg._t);
  svg._t = setTimeout(() => svg.classList.remove('c'), 130);
}
function frogFrame(t) {
  for (const n of run.leader) if (!n.shown && t >= n.t) { n.shown = true; croakVis(leaderFrog); }
  for (const n of run.expect) if (!n.hit && !n.missed && t - run.offset > n.t + run.win) { n.missed = true; run.c.m++; feedback('ミス', 'miss'); }
  const beat = t / BEAT;
  stage.classList.remove('listen', 'repeat');
  if (beat < COUNTIN) {
    phaseEl.textContent = beat < 0 ? '' : String(COUNTIN - Math.floor(beat));
    counterEl.textContent = '';
  } else {
    const i = Math.floor((beat - COUNTIN) / 8), inBar = (beat - COUNTIN) % 8;
    if (i < PATTERNS.length) {
      const listening = inBar < 4;
      phaseEl.textContent = listening ? 'きいて' : 'まねして';
      stage.classList.add(listening ? 'listen' : 'repeat');
      counterEl.textContent = (i + 1) + ' / ' + PATTERNS.length;
    } else phaseEl.textContent = '';
  }
  const ph = ((beat % 1) + 1) % 1;
  const y = beat >= 0 ? -7 * Math.max(0, 1 - ph * 5) : 0;
  leaderWrap.style.transform = meWrap.style.transform = `translateY(${y}px)`;
}
function frogTap() {
  croak(run.bus, ctx.currentTime, 240);
  croakVis(meFrog); retrigger(ring);
  const t = now() - run.offset;
  let best = null, bd = 1;
  for (const n of run.expect) {
    if (n.hit || n.missed) continue;
    const d = Math.abs(t - n.t);
    if (d < bd) { bd = d; best = n; }
  }
  if (!best || bd > run.win) return;
  best.hit = true; judge(bd);
}

/* ---------- ステージ2：でんしゃで どうぞ ---------- */
// G=おばあちゃん S=会社員 K=学生 -=走行中
const TRAIN_SEQ = '-G-S-G-K-GS-KG-SGKG-SSG-'.split('');
const LABEL = { G: 'おばあちゃん！', S: 'かいしゃいん', K: 'がくせい' };
const SKIN = '#f6cfae';
const PAL = {
  kid: { torso: '#ffcf3f', leg: SKIN, shoe: '#e0474c', hair: '#3b2a1f' },
  G: { torso: '#b98fd6', leg: '#8a7560', shoe: '#6b4b3a', hair: '#d9d9e3', skirt: '#7d6a9c' },
  S: { torso: '#2f3e66', leg: '#2f3e66', shoe: '#1c1c22', hair: '#1d1d24' },
  K: { torso: '#2a2a35', leg: '#2a2a35', shoe: '#5a3a26', hair: '#6b4428' }
};
const SEAT = { x: 250, y: 484 }, KID_UP = { x: 322, y: 600 }, SPOT = { x: 140, y: 600 }, DOOR = { x: -50, y: 600 };

function person(type, pose) {
  const P = PAL[type], st = pose === 'stand';
  const lt = st ? -48 : 0, ll = st ? 48 : (type === 'kid' ? 50 : 62), uy = st ? -48 : 0;
  let s = '';
  s += `<rect x="-15" y="${lt}" width="11" height="${ll}" rx="4" fill="${P.leg}"/><rect x="4" y="${lt}" width="11" height="${ll}" rx="4" fill="${P.leg}"/>`;
  s += `<ellipse cx="-10" cy="${lt + ll}" rx="10" ry="5" fill="${P.shoe}"/><ellipse cx="10" cy="${lt + ll}" rx="10" ry="5" fill="${P.shoe}"/>`;
  if (type === 'G') s += `<path d="M-24 ${lt - 6} L24 ${lt - 6} L29 ${lt + 26} L-29 ${lt + 26} Z" fill="${P.skirt}"/>`;
  if (type === 'kid') s += `<rect x="-21" y="${lt - 6}" width="42" height="18" rx="6" fill="#3f6fd1"/>`;
  if (type === 'G' && st) s += `<path d="M31 -62 L33 0 M31 -62 q0 -11 -10 -9" stroke="#8b5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  s += `<g transform="translate(0 ${uy})">`;
  s += `<rect x="-33" y="-66" width="11" height="50" rx="5.5" fill="${P.torso}"/><rect x="22" y="-66" width="11" height="50" rx="5.5" fill="${P.torso}"/>`;
  s += `<circle cx="-27.5" cy="-14" r="6" fill="${SKIN}"/><circle cx="27.5" cy="-14" r="6" fill="${SKIN}"/>`;
  if (type === 'S' && st) s += `<rect x="20" y="-16" width="24" height="17" rx="3" fill="#5a3b28"/>`;
  s += `<rect x="-24" y="-74" width="48" height="76" rx="16" fill="${P.torso}"/>`;
  if (type === 'G') s += `<path d="M-12 -74 Q0 -62 12 -74 Z" fill="#fff"/><circle cy="-52" r="2.6" fill="#fff"/><circle cy="-36" r="2.6" fill="#fff"/><circle cy="-20" r="2.6" fill="#fff"/>`;
  if (type === 'S') s += `<path d="M-11 -74 L0 -50 L11 -74 Z" fill="#fff"/><path d="M-3.5 -70 L3.5 -70 L5.5 -44 L0 -38 L-5.5 -44 Z" fill="#d9434f"/>`;
  if (type === 'K') s += `<path d="M-15 -72 L-15 -40 M15 -72 L15 -40" stroke="#b06b35" stroke-width="4" stroke-linecap="round"/><rect x="-13" y="-77" width="26" height="7" rx="2" fill="#15151c"/><circle cy="-58" r="2.6" fill="#f2c230"/><circle cy="-44" r="2.6" fill="#f2c230"/><circle cy="-30" r="2.6" fill="#f2c230"/>`;
  if (type === 'kid') s += `<path d="M-17 -72 Q0 -58 17 -72" stroke="#e3a900" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="-15" y="-32" width="30" height="13" rx="5" fill="#f2bd1d"/>`;
  s += `<circle cy="-96" r="23" fill="${SKIN}"/>`;
  if (type === 'G') s += `<ellipse cy="-111" rx="24" ry="12" fill="${P.hair}"/><circle cy="-125" r="9" fill="${P.hair}"/><circle cx="-20" cy="-101" r="7" fill="${P.hair}"/><circle cx="20" cy="-101" r="7" fill="${P.hair}"/>`;
  if (type === 'S') s += `<path d="M-23 -98 Q-24 -122 0 -121 Q22 -121 23 -100 Q12 -110 -6 -108 Q-16 -106 -23 -98 Z" fill="${P.hair}"/>`;
  if (type === 'K') s += `<path d="M-23 -96 Q-25 -122 0 -122 Q25 -122 23 -96 L17 -104 L12 -98 L6 -105 L0 -99 L-6 -105 L-12 -98 L-17 -104 Z" fill="${P.hair}"/>`;
  if (type === 'kid') s += `<path d="M-23 -96 Q-24 -123 0 -122 Q24 -123 23 -96 Q10 -108 -4 -104 Q-14 -102 -23 -96 Z" fill="${P.hair}"/><path d="M2 -121 q6 -10 12 -6" stroke="${P.hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if (type === 'G') s += `<path d="M-12 -94 q4 -4 8 0 M4 -94 q4 -4 8 0" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="-8" cy="-94" r="7" stroke="#8a6d5a" stroke-width="1.6" fill="none"/><circle cx="8" cy="-94" r="7" stroke="#8a6d5a" stroke-width="1.6" fill="none"/>`;
  else s += `<circle cx="-8" cy="-94" r="2.8" fill="#2a2226"/><circle cx="8" cy="-94" r="2.8" fill="#2a2226"/>`;
  s += type === 'S' ? `<path d="M-5 -83 L5 -83" stroke="#8a3a3a" stroke-width="2" stroke-linecap="round"/>`
                    : `<path d="M-5 -84 Q0 -80 5 -84" stroke="#8a3a3a" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  s += `<circle cx="-14" cy="-86" r="4" fill="#ff9aa8" opacity=".55"/><circle cx="14" cy="-86" r="4" fill="#ff9aa8" opacity=".55"/>`;
  s += '</g>';
  return s;
}
function bubbleSvg(text, pose, dx) {
  const y = (pose === 'stand' ? -48 : 0) - 150, w = [...text].length * 15 + 24;
  return `<g transform="translate(${dx || 0} ${y})"><path d="M-7 8 L0 19 L7 8" fill="#fff" stroke="#2b3b3a" stroke-width="2" stroke-linejoin="round"/>` +
    `<rect x="${-w / 2}" y="-20" width="${w}" height="30" rx="15" fill="#fff" stroke="#2b3b3a" stroke-width="2"/>` +
    `<text y="-4" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#2b3b3a" font-family="M PLUS Rounded 1c, Hiragino Maru Gothic ProN, sans-serif">${text}</text></g>`;
}
function place(g, p, instant) {
  const tf = `translate(${p.x}px, ${p.y}px)`;
  if (instant) { g.style.transition = 'none'; g.style.transform = tf; g.getBoundingClientRect(); g.style.transition = ''; }
  else g.style.transform = tf;
}
function renderKid(pose, bubble) { kidG.innerHTML = person('kid', pose) + (bubble ? bubbleSvg(bubble, pose, -26) : ''); }
function renderPax(type, pose, bubble) { paxG.innerHTML = person(type, pose) + (bubble ? bubbleSvg(bubble, pose, 0) : ''); }

(function buildScenery() {
  let h = '';
  for (let k = 0; k < 3; k++) {
    const x = 80 + k * 300;
    h += `<path d="M${x} 305 L${x} 262 Q${x + 45} 222 ${x + 95} 250 Q${x + 160} 205 ${x + 215} 246 Q${x + 260} 228 ${x + 300} 262 L${x + 300} 305 Z" fill="#a6dd8f"/>`;
    h += `<rect x="${x + 140}" y="262" width="18" height="16" fill="#fff"/><path d="M${x + 136} 263 L${x + 149} 251 L${x + 162} 263 Z" fill="#e57373"/>`;
    h += `<rect x="${x + 232}" y="266" width="14" height="13" fill="#fff"/><path d="M${x + 229} 267 L${x + 239} 258 L${x + 249} 267 Z" fill="#6a9ee0"/>`;
  }
  hillsG.innerHTML = h;
  let p = '';
  for (let k = 0; k < 4; k++) p += `<rect x="${120 + k * 150}" y="172" width="5" height="133" fill="#6b7b77"/><rect x="112" y="180" width="21" height="4" fill="#6b7b77" transform="translate(${k * 150} 0)"/>`;
  polesG.innerHTML = p;
})();

function setupTrain(bus, t0) {
  const bars = TRAIN_SEQ.map((type, i) => ({ type, start: (COUNTIN + i * 4) * BEAT, hit: false, missed: false, wrong: false, spoken: false }));
  run.totalBeats = COUNTIN + bars.length * 4;
  for (let b = 0; b < run.totalBeats; b++) gatan(bus, t0 + b * BEAT, b % 2 === 0);
  for (let b = 0; b < COUNTIN; b++) note(bus, t0 + b * BEAT, b === 3 ? 91 : 84, .15, .1, 'sine');
  bars.forEach(b => {
    if (b.type === '-') return;
    const s = t0 + b.start;
    if (b.type === 'G') { bell(bus, s + BEAT, 88, .3); bell(bus, s + 2 * BEAT, 84, .3); }
    else { buzz(bus, s + BEAT); buzz(bus, s + 2 * BEAT); }
  });
  scheduleMusic(bus, t0, COUNTIN, bars.length, TRAIN_MEL, TRAIN_BASS);
  Object.assign(run, { bars, fbEl: $('tfb'), vis: { bar: -99, left: -99, seated: false, wrongNow: false } });
  renderKid('sit'); place(kidG, SEAT, true);
  paxG.style.opacity = 0; paxG.innerHTML = '';
  say('はっしゃ しまーす', 1.4, 1.25);
}
function enterBar(ci) {
  const bar = run.bars[ci];
  run.vis.wrongNow = false;
  if (bar.type === '-' && run.vis.seated) return; // おばあちゃんはもう少し座っていく
  run.vis.seated = false;
  renderKid('sit'); place(kidG, SEAT);
  if (bar.type === '-') { paxG.style.opacity = 0; return; }
  renderPax(bar.type, 'stand');
  paxG.style.opacity = 1; place(paxG, DOOR, true);
  requestAnimationFrame(() => place(paxG, SPOT));
}
function maybeLeave(ci) {
  const bar = run.bars[ci], next = run.bars[ci + 1];
  if (bar.type === '-') { if (run.vis.seated) paxG.style.opacity = 0; return; }
  if (bar.type === 'G' && bar.hit && next && next.type === '-') return;
  paxG.style.opacity = 0;
}
function trainFrame(t) {
  const beat = t / BEAT, tt = Math.max(t, 0);
  hillsG.setAttribute('transform', `translate(${-((tt * 40) % 300)} 0)`);
  polesG.setAttribute('transform', `translate(${-((tt * 260) % 150)} 0)`);
  const ph = ((beat % 1) + 1) % 1;
  roomG.setAttribute('transform', `translate(0 ${beat >= 0 ? 2.5 * Math.max(0, 1 - ph * 6) : 0})`);

  for (const b of run.bars) if (b.type !== '-' && !b.spoken && t >= b.start - .18) { b.spoken = true; say(LABEL[b.type].replace('！', '')); }
  for (const b of run.bars) {
    if (b.type === 'G' && !b.hit && !b.missed && t - run.offset > b.start + 3 * BEAT + run.win) {
      b.missed = true; run.c.m++; feedback('ミス', 'miss'); renderPax('G', 'stand', '…');
    }
  }
  const ci = Math.floor((beat - COUNTIN) / 4), inBar = (beat - COUNTIN) - ci * 4, bar = run.bars[ci];
  if (beat < COUNTIN) { phaseEl.textContent = beat < 0 ? '' : String(COUNTIN - Math.floor(beat)); counterEl.textContent = ''; }
  else if (bar) { phaseEl.textContent = (bar.type !== '-' && inBar < 3) ? LABEL[bar.type] : ''; counterEl.textContent = `${ci + 1} / ${run.bars.length}`; }
  else phaseEl.textContent = '';
  doorP.classList.toggle('open', !!(bar && bar.type !== '-' && inBar < .9));
  if (bar && ci !== run.vis.bar) { run.vis.bar = ci; enterBar(ci); }
  if (bar && inBar > 3.55 && run.vis.left !== ci) { run.vis.left = ci; maybeLeave(ci); }
}
function trainTap() {
  pop(run.bus, ctx.currentTime);
  const t = now() - run.offset, beat = t / BEAT;
  const ci = Math.floor((beat - COUNTIN) / 4), bar = run.bars[ci];
  if (bar && bar.type === 'G' && !bar.hit && !bar.missed) {
    const d = Math.abs(t - (bar.start + 3 * BEAT));
    if (d <= run.win) {
      bar.hit = true; judge(d); run.vis.seated = true;
      sparkle(run.bus, ctx.currentTime + .05);
      renderKid('stand', 'どうぞ！'); place(kidG, KID_UP);
      setTimeout(() => {
        if (!run || run.done) return;
        renderPax('G', 'sit', 'ありがと♪'); place(paxG, SEAT);
        say('ありがとね', .8, 1.15);
      }, 220);
      return;
    }
  }
  if (bar && (bar.type === 'S' || bar.type === 'K') && !bar.wrong && Math.abs(t - (bar.start + 3 * BEAT)) <= .35) {
    bar.wrong = true; run.c.w++; run.vis.wrongNow = true;
    feedback('あれっ？', 'miss');
    renderKid('stand', 'どうぞ…'); place(kidG, { x: SEAT.x, y: 600 });
    renderPax(bar.type, 'stand', 'えっ…？');
    return;
  }
  if (run.vis.seated || run.vis.wrongNow) return;
  renderKid('stand'); place(kidG, { x: SEAT.x, y: 600 });
  clearTimeout(run.hopT);
  run.hopT = setTimeout(() => { if (run && !run.vis.seated && !run.vis.wrongNow) { renderKid('sit'); place(kidG, SEAT); } }, 220);
}

/* ---------- けっか ---------- */
function finish() {
  run.done = true;
  stage.classList.remove('listen', 'repeat');
  phaseEl.textContent = '';
  let pct, rank, rows;
  const c = run.c;
  if (stageId === 'frog') {
    pct = Math.round(run.pts / run.expect.length * 100);
    rank = pct >= 90 ? 'こだまの名人' : pct >= 70 ? 'いい声してる' : pct >= 50 ? 'もうひと息' : 'もう一回ケロ';
    rows = [['ぴったり', c.p], ['いいね', c.g], ['おしい', c.n], ['ミス', c.m]];
  } else {
    const nG = run.bars.filter(b => b.type === 'G').length;
    const fakes = run.bars.filter(b => b.type === 'S' || b.type === 'K');
    const skips = fakes.filter(b => !b.wrong).length;
    pct = Math.round((run.pts + skips) / (nG + fakes.length) * 100);
    rank = pct >= 90 ? 'やさしさ名人' : pct >= 70 ? 'いい人だね' : pct >= 50 ? 'もうひと息' : 'もう一回どうぞ';
    rows = [['ぴったり', c.p], ['いいね', c.g], ['おしい', c.n], ['ゆずれなかった', c.m], ['まちがえてゆずった', c.w]];
  }
  $('pct').textContent = pct;
  $('rank').textContent = rank;
  $('stats').innerHTML = rows.map(r => `<span>${r[0]}</span><span>${r[1]}</span>`).join('');
  $('resultOv').hidden = false;
}

document.querySelectorAll('.stagebtn').forEach(b => b.addEventListener('click', () => begin(b.dataset.stage)));
$('againBtn').addEventListener('click', () => begin());
$('menuBtn').addEventListener('click', () => { $('resultOv').hidden = true; $('startOv').hidden = false; });
</script>
